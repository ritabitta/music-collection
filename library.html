<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的收藏库 | My Music Vault</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="My Music Vault">
  <meta property="og:description" content="A home for the albums, artists and sounds I love.">
  <meta property="og:image" content="https://ritabitta.github.io/music-collection/images/og-image.jpg">
  <meta property="og:url" content="https://ritabitta.github.io/music-collection/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">


  <style>
    :root {
      --bg: #11120f;
      --panel: #1c1e19;
      --text: #f4f3ec;
      --muted: #aaa99f;
      --lime: #d9ff62;
      --line: rgba(255, 255, 255, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    a { color: inherit; }

    main {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 50px 0 90px;
    }

    .intro {
      padding: clamp(26px, 6vw, 64px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        radial-gradient(circle at 85% 15%, rgba(217, 255, 98, .2), transparent 34%),
        linear-gradient(135deg, #292b23, #171813);
    }

    .eyebrow {
      color: var(--lime);
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .18em;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(2.6rem, 7vw, 5.4rem);
      line-height: .98;
    }

    .intro p {
      max-width: 640px;
      color: #d1d0c7;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .intro .who {
      display: inline-block;
      margin-top: 14px;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--lime);
      color: #171810;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 26px 0 18px;
    }

    .toolbar a, .toolbar button {
      padding: 11px 16px;
      border: 1px solid var(--lime);
      border-radius: 999px;
      background: var(--lime);
      color: #171810;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .toolbar button.ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }

    .count { color: var(--muted); }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .album-card {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }

    .cover {
      flex: 0 0 74px;
      width: 74px;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #d9ff62, #ff805e);
      color: #171810;
      font-weight: 900;
      font-size: 1.6rem;
    }

    .cover img { width: 100%; height: 100%; object-fit: cover; }

    .info { min-width: 0; flex: 1; }
    .info h2 { margin: 0 0 5px; font-size: 1.05rem; overflow-wrap: anywhere; }
    .info p { margin: 0; color: var(--muted); font-size: .88rem; }

    .remove {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 8px 11px;
      cursor: pointer;
      font-size: .82rem;
      white-space: nowrap;
    }

    .remove:hover { color: var(--coral, #ff805e); border-color: var(--coral, #ff805e); }

    .empty {
      padding: 34px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      color: var(--muted);
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 760px) {
      main { width: calc(100% - 28px); padding-top: 24px; }
      .album-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div id="nav-placeholder"></div>

  <main>
    <section class="intro">
      <div class="eyebrow" data-i18n="auth.library.eyebrow">MY MUSIC LIBRARY</div>
      <h1 data-i18n="auth.library.title">我的个人收藏库。</h1>
      <p data-i18n="auth.library.intro">从任意专辑页点“加入我的收藏库”，就会出现在这里。</p>
      <span class="who" id="who-badge" hidden></span>
    </section>

    <!-- 未登录提示 -->
    <section id="guest-state" hidden>
      <div class="empty" style="margin-top:26px;">
        <p data-i18n="auth.library.guest">登录后才能看到你的收藏库。</p>
        <div class="toolbar" style="justify-content:center;">
          <a href="login.html" data-i18n="nav.login">登录</a>
          <a href="register.html" data-i18n="nav.register">注册</a>
        </div>
      </div>
    </section>

    <!-- 已登录 -->
    <div id="user-state" hidden>
      <div class="toolbar">
        <a href="albums.html" data-i18n="auth.library.browse">浏览专辑 ↗</a>
        <button id="logout-button" type="button" class="ghost" data-i18n="auth.library.logout">退出登录</button>
        <span class="count" id="count"></span>
      </div>

      <section class="album-grid" id="album-grid" aria-label="收藏的专辑"></section>
      <div class="empty" id="empty-state" hidden data-i18n="auth.library.empty">你的收藏库还是空的。去专辑页点“加入我的收藏库”吧。</div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="nav.js"></script>
  <script src="js/albums-data.js"></script>

  <script>
    const I18N = window.I18N;
    const vault = window.MUSIC_VAULT;
    const albums = vault?.albums || [];
    const user = window.Auth.currentUser();

    const guestState = document.getElementById("guest-state");
    const userState = document.getElementById("user-state");
    const grid = document.getElementById("album-grid");
    const emptyState = document.getElementById("empty-state");
    const count = document.getElementById("count");
    const whoBadge = document.getElementById("who-badge");

    if (!user) {
      guestState.hidden = false;
    } else {
      whoBadge.hidden = false;
      whoBadge.textContent = I18N.pick("你好，" + user + " 的收藏库", user + "'s library");
      userState.hidden = false;

      const favIds = window.Auth.favorites(user);
      const favAlbums = albums.filter(a => favIds.indexOf(String(a.id)) !== -1);

      count.textContent = I18N.pick(`已收藏 ${favAlbums.length} 张专辑`, `${favAlbums.length} albums saved`);
      emptyState.hidden = favAlbums.length !== 0;

      favAlbums.forEach(album => {
        const card = document.createElement("article");
        card.className = "album-card";

        const cover = document.createElement("div");
        cover.className = "cover";
        if (album.cover) {
          const img = document.createElement("img");
          img.src = album.cover;
          img.alt = album.title + " 专辑封面";
          img.onerror = () => { img.remove(); cover.textContent = (album.title || "♫").slice(0, 1); };
          cover.appendChild(img);
        } else {
          cover.textContent = (album.title || "♫").slice(0, 1);
        }

        const info = document.createElement("div");
        info.className = "info";
        const title = document.createElement("h2");
        title.textContent = I18N.pick(album.title, album.titleEn);
        const artist = document.createElement("p");
        artist.textContent = I18N.pick(album.artist, (vault.artists.find(a => a.id === album.artistId) || {}).nameEn);
        info.append(title, artist);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.textContent = I18N.pick("移除", "Remove");
        remove.addEventListener("click", () => {
          window.Auth.toggleFavorite(album.id);
          window.location.reload();
        });

        card.append(cover, info, remove);
        // 整卡可点击进入专辑
        card.style.cursor = "pointer";
        card.addEventListener("click", (e) => {
          if (e.target === remove) return;
          window.location.href = "album.html?id=" + encodeURIComponent(album.id);
        });
        grid.appendChild(card);
      });
    }

    document.getElementById("logout-button").addEventListener("click", () => {
      window.Auth.logout();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
