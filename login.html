<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | My Music Vault</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --bg: #11120f;
      --panel: #1c1e19;
      --text: #f4f3ec;
      --muted: #aaa99f;
      --lime: #d9ff62;
      --line: rgba(255, 255, 255, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    a { color: inherit; }

    main {
      width: min(480px, calc(100% - 40px));
      margin: 0 auto;
      padding: 60px 0 90px;
    }

    .auth-card {
      padding: clamp(26px, 5vw, 48px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        radial-gradient(circle at 85% 10%, rgba(217, 255, 98, .16), transparent 38%),
        linear-gradient(135deg, #292b23, #171813);
    }

    .eyebrow {
      color: var(--lime);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .18em;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.05;
    }

    .intro {
      margin: 0 0 26px;
      color: var(--muted);
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: .85rem;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--lime);
      box-shadow: 0 0 0 3px rgba(217, 255, 98, .12);
    }

    button[type="submit"] {
      width: 100%;
      min-height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 12px;
      background: var(--lime);
      color: #171810;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }

    .switch {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: var(--lime);
      text-decoration: none;
      font-size: .9rem;
    }

    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: .9rem;
      line-height: 1.5;
    }

    .message.error { background: #3a2320; color: #ffb9a8; }
    .message.ok { background: #223526; color: #c9f0b0; }
  </style>
</head>

<body>
  <div id="nav-placeholder"></div>

  <main>
    <section class="auth-card">
      <div class="eyebrow" data-i18n="auth.login.eyebrow">WELCOME BACK</div>
      <h1 data-i18n="auth.login.title">登录你的收藏库。</h1>
      <p class="intro" data-i18n="auth.login.intro">登录后即可打开你的个人音乐收藏库。</p>

      <form id="login-form" novalidate>
        <label for="username" data-i18n="auth.username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" data-i18n-ph="auth.username-ph" placeholder="用户名">

        <label for="password" data-i18n="auth.password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" data-i18n-ph="auth.password-ph" placeholder="密码">

        <button type="submit" data-i18n="auth.login.submit">登录</button>
      </form>

      <div class="message" id="message" hidden></div>
      <a class="switch" href="register.html" data-i18n="auth.login.to-register">还没有账号？注册 ↗</a>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="nav.js"></script>

  <script>
    const I18N = window.I18N;
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const res = window.Auth.login(username, password);

      message.hidden = false;
      if (res.ok) {
        message.className = "message ok";
        message.textContent = I18N.pick("登录成功，正在进入你的收藏库…", "Logged in — opening your library…");
        setTimeout(() => { window.location.href = "library.html"; }, 500);
      } else {
        message.className = "message error";
        message.textContent = res.message;
      }
    });
  </script>
</body>
</html>
