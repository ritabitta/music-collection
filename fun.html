<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>趣味 | My Music Vault</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --bg: #11120f;
      --panel: #1c1e19;
      --text: #f4f3ec;
      --muted: #aaa99f;
      --lime: #d9ff62;
      --coral: #ff805e;
      --blue: #86c8e8;
      --line: rgba(255, 255, 255, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    a { color: inherit; }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 50px 0 90px;
    }

    .intro {
      padding: clamp(28px, 6vw, 68px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 128, 94, .2), transparent 34%),
        radial-gradient(circle at 85% 20%, rgba(217, 255, 98, .18), transparent 34%),
        linear-gradient(135deg, #292b23, #171813);
    }

    .eyebrow {
      color: var(--lime);
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .18em;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(2.8rem, 8vw, 6.2rem);
      line-height: .96;
    }

    .intro p {
      max-width: 650px;
      color: #d1d0c7;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .toy-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 34px;
    }

    .toy {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        radial-gradient(circle at 88% 8%, rgba(217, 255, 98, .1), transparent 40%),
        var(--panel);
      display: flex;
      flex-direction: column;
    }

    .toy.full { grid-column: 1 / -1; }

    .toy h2 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    .toy .hint {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: .9rem;
    }

    .toy button {
      padding: 11px 16px;
      border: 1px solid var(--lime);
      border-radius: 999px;
      background: var(--lime);
      color: #171810;
      font-weight: bold;
      cursor: pointer;
    }

    .toy button.ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }

    /* 黑胶唱片 */
    .vinyl-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 16px 0;
    }

    .vinyl {
      position: relative;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle at center, #1b1b1b 0 3px, #101010 3px 6px);
      box-shadow: inset 0 0 70px rgba(0, 0, 0, .85), 0 22px 50px rgba(0, 0, 0, .5);
    }

    .vinyl .label {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 92px;
      height: 92px;
      margin: -46px 0 0 -46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      text-align: center;
      background: linear-gradient(135deg, var(--lime), var(--coral));
      color: #171810;
      font-weight: 900;
      font-size: .8rem;
      line-height: 1.2;
      padding: 8px;
    }

    .vinyl .hole {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      background: #000;
    }

    .vinyl.spinning { animation: vinyl-spin 1.5s linear infinite; }

    @keyframes vinyl-spin {
      to { transform: rotate(360deg); }
    }

    .vinyl-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }

    /* 猜歌手 */
    .quiz-cover {
      width: 140px;
      height: 140px;
      border-radius: 14px;
      object-fit: cover;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #d9ff62, #ff805e);
    }

    .quiz-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    .quiz-options button {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }

    .quiz-options button.correct { background: #2f6e4f; border-color: #2f6e4f; color: #eafff0; }
    .quiz-options button.wrong { background: #7a3b32; border-color: #7a3b32; color: #ffe9e5; }

    .quiz-feedback { min-height: 22px; margin: 8px 0; font-weight: bold; }
    .quiz-score { color: var(--muted); font-size: .9rem; }

    /* 节奏测试 */
    .bpm-display {
      font-size: 4rem;
      font-weight: 900;
      color: var(--lime);
      line-height: 1;
      margin: 8px 0 4px;
    }

    .bpm-display small { font-size: 1.2rem; color: var(--muted); font-weight: 400; }

    .tap-pad {
      align-self: stretch;
      min-height: 120px;
      border: 2px dashed var(--line);
      border-radius: 18px;
      background: transparent;
      color: var(--text);
      font-size: 1.1rem;
      font-weight: bold;
    }

    .tap-pad:active { border-color: var(--lime); background: rgba(217, 255, 98, .06); }

    /* 心情生成器 */
    .mood-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .mood-buttons button {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }

    .mood-result {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .03);
    }

    .mood-result h3 { margin: 0 0 8px; }
    .mood-result p { margin: 0 0 12px; color: var(--muted); }
    .mood-result a { color: var(--lime); text-decoration: none; }

    @media (max-width: 760px) {
      main { width: calc(100% - 28px); padding-top: 24px; }
      .toy-grid { grid-template-columns: 1fr; }
      .toy.full { grid-column: auto; }
      .vinyl { width: 190px; height: 190px; }
    }
  </style>
</head>

<body>
  <div id="nav-placeholder"></div>

  <main>
    <section class="intro">
      <div class="eyebrow" data-i18n="fun.eyebrow">FUN ZONE</div>
      <h1 data-i18n-html="fun.title">玩一会儿，<br>再听一会儿。</h1>
      <p data-i18n="fun.intro">一些“没用但有趣”的音乐小玩意和小游戏：转唱片、猜歌手、测节奏、生成心情歌单。</p>
    </section>

    <section class="toy-grid">

      <!-- 黑胶唱片 -->
      <article class="toy">
        <h2 data-i18n="fun.vinyl.title">转动的黑胶唱片</h2>
        <p class="hint" data-i18n="fun.vinyl.hint">点“播放”，看唱片转起来。解压又没用，但很治愈。</p>
        <div class="vinyl-stage">
          <div class="vinyl" id="vinyl">
            <span class="label">MY MUSIC<br>VAULT</span>
            <span class="hole"></span>
          </div>
          <div class="vinyl-controls">
            <button id="vinyl-toggle" type="button" data-i18n="fun.play">▶ 播放</button>
            <button id="vinyl-speed" type="button" class="ghost" data-i18n="fun.speed">切换 33 / 45 转</button>
          </div>
        </div>
      </article>

      <!-- 猜歌手 -->
      <article class="toy">
        <h2 data-i18n="fun.quiz.title">猜歌手小游戏</h2>
        <p class="hint" data-i18n="fun.quiz.hint">看专辑封面，猜猜这是谁的专辑。</p>
        <img class="quiz-cover" id="quiz-cover" src="" alt="专辑封面">
        <div class="quiz-options" id="quiz-options"></div>
        <p class="quiz-feedback" id="quiz-feedback"></p>
        <p class="quiz-score" id="quiz-score"></p>
        <button id="quiz-next" type="button" class="ghost" data-i18n="fun.next">下一题 →</button>
      </article>

      <!-- 节奏测试 -->
      <article class="toy">
        <h2 data-i18n="fun.bpm.title">节奏测试（BPM）</h2>
        <p class="hint" data-i18n="fun.bpm.hint">跟着节奏点击下面的区域，测测你的手速有多少 BPM。</p>
        <div class="bpm-display"><span id="bpm-value">—</span> <small>BPM</small></div>
        <button class="tap-pad" id="tap-pad" type="button" data-i18n="fun.bpm.tap">点击这里打拍子</button>
        <div style="display:flex; gap:10px; margin-top:12px;">
          <button id="bpm-reset" type="button" class="ghost" data-i18n="fun.reset">重置</button>
        </div>
      </article>

      <!-- 心情生成器 -->
      <article class="toy">
        <h2 data-i18n="fun.mood.title">音乐心情生成器</h2>
        <p class="hint" data-i18n="fun.mood.hint">选一个心情，帮你从收藏里挑一份歌单。</p>
        <div class="mood-buttons" id="mood-buttons"></div>
        <div class="mood-result" id="mood-result"></div>
      </article>

    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="nav.js"></script>
  <script src="js/albums-data.js"></script>

  <script>
    const I18N = window.I18N;
    const vault = window.MUSIC_VAULT;
    const albums = vault?.albums || [];
    const artists = vault?.artists || [];
    const playlists = vault?.playlists || [];

    /* ===== 黑胶唱片 ===== */
    (function () {
      const vinyl = document.getElementById("vinyl");
      const toggle = document.getElementById("vinyl-toggle");
      const speed = document.getElementById("vinyl-speed");
      let spinning = false;
      let rpm = 33;

      function applySpeed() {
        vinyl.style.animationDuration = rpm === 33 ? "1.8s" : "1.32s";
      }

      toggle.addEventListener("click", () => {
        spinning = !spinning;
        vinyl.classList.toggle("spinning", spinning);
        toggle.textContent = spinning
          ? I18N.pick("⏸ 暂停", "⏸ Pause")
          : I18N.pick("▶ 播放", "▶ Play");
      });

      speed.addEventListener("click", () => {
        rpm = rpm === 33 ? 45 : 33;
        applySpeed();
        speed.textContent = I18N.pick("当前 " + rpm + " 转", rpm + " RPM");
      });

      applySpeed();
    })();

    /* ===== 猜歌手 ===== */
    (function () {
      const cover = document.getElementById("quiz-cover");
      const optionsBox = document.getElementById("quiz-options");
      const feedback = document.getElementById("quiz-feedback");
      const scoreBox = document.getElementById("quiz-score");
      const nextBtn = document.getElementById("quiz-next");

      let current = null;
      let score = 0;
      let answered = false;

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function newQuestion() {
        answered = false;
        feedback.textContent = "";
        if (!albums.length) return;
        current = albums[Math.floor(Math.random() * albums.length)];
        cover.src = current.cover || "";
        cover.alt = "专辑封面";

        const correct = current.artist;
        const others = shuffle(artists.map(a => a.name).filter(n => n !== correct)).slice(0, 3);
        const options = shuffle([correct, ...others]);

        optionsBox.innerHTML = "";
        options.forEach(name => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = name;
          btn.addEventListener("click", () => choose(name, btn));
          optionsBox.appendChild(btn);
        });
      }

      function choose(name, btn) {
        if (answered) return;
        answered = true;
        const correct = current.artist;
        const isCorrect = name === correct;
        if (isCorrect) {
          score++;
          feedback.textContent = I18N.pick("答对啦！🎉", "Correct! 🎉");
          btn.classList.add("correct");
        } else {
          feedback.textContent = I18N.pick("不对哦，正确答案是：" + correct, "Nope — it's " + correct);
          btn.classList.add("wrong");
          optionsBox.querySelectorAll("button").forEach(b => {
            if (b.textContent === correct) b.classList.add("correct");
          });
        }
        scoreBox.textContent = I18N.pick("得分：" + score, "Score: " + score);
      }

      nextBtn.addEventListener("click", newQuestion);
      newQuestion();
      scoreBox.textContent = I18N.pick("得分：0", "Score: 0");
    })();

    /* ===== 节奏测试 ===== */
    (function () {
      const tapPad = document.getElementById("tap-pad");
      const value = document.getElementById("bpm-value");
      const resetBtn = document.getElementById("bpm-reset");
      const times = [];
      const MAX = 12;

      tapPad.addEventListener("click", () => {
        const now = performance.now();
        times.push(now);
        if (times.length > MAX) times.shift();

        if (times.length >= 3) {
          let total = 0;
          let count = 0;
          for (let i = 1; i < times.length; i++) {
            total += times[i] - times[i - 1];
            count++;
          }
          const avg = total / count;
          value.textContent = Math.round(60000 / avg);
        } else {
          value.textContent = "—";
        }
        tapPad.textContent = I18N.pick("继续打拍子…", "Keep tapping…");
      });

      resetBtn.addEventListener("click", () => {
        times.length = 0;
        value.textContent = "—";
        tapPad.textContent = I18N.pick("点击这里打拍子", "Tap here to the beat");
      });
    })();

    /* ===== 心情生成器 ===== */
    (function () {
      const moods = [
        { key: "happy", zh: "开心 🎉", en: "Happy 🎉", playlistId: "bright-energy" },
        { key: "night", zh: "深夜 🌙", en: "Late night 🌙", playlistId: "late-night" },
        { key: "calm", zh: "安静 🎹", en: "Calm 🎹", albumId: "25" },
        { key: "nostalgic", zh: "怀旧 📼", en: "Nostalgic 📼", playlistId: "mandarin-memories" }
      ];

      const box = document.getElementById("mood-buttons");
      const result = document.getElementById("mood-result");

      moods.forEach(mood => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = I18N.pick(mood.zh, mood.en);
        btn.addEventListener("click", () => show(mood));
        box.appendChild(btn);
      });

      function show(mood) {
        let html = "";
        if (mood.playlistId) {
          const pl = playlists.find(p => p.id === mood.playlistId);
          if (pl) {
            html = `<h3>${I18N.pick(pl.title, pl.titleEn)}</h3>
                    <p>${I18N.pick(pl.description, pl.descriptionEn)}</p>
                    <a href="playlists.html#${encodeURIComponent(pl.id)}">${I18N.pick("去听这份歌单 ↗", "Open this playlist ↗")}</a>`;
          }
        } else if (mood.albumId) {
          const al = albums.find(a => a.id === mood.albumId);
          if (al) {
            html = `<h3>${I18N.pick(al.title, al.titleEn)} — ${I18N.pick(al.artist, (artists.find(x => x.id === al.artistId) || {}).nameEn)}</h3>
                    <p>${I18N.pick(al.description, al.descriptionEn)}</p>
                    <a href="album.html?id=${encodeURIComponent(al.id)}">${I18N.pick("去听这张专辑 ↗", "Open this album ↗")}</a>`;
          }
        }
        result.innerHTML = html || I18N.pick("选一个心情试试看。", "Pick a mood to get started.");
      }
    })();
  </script>
</body>
</html>
