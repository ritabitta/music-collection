<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐风格 | My Music Vault</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --bg: #11120f;
      --panel: #1c1e19;
      --text: #f4f3ec;
      --muted: #aaa99f;
      --lime: #d9ff62;
      --line: rgba(255, 255, 255, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(1160px, calc(100% - 40px));
      margin: 0 auto;
      padding: 50px 0 90px;
    }

    .intro {
      padding: clamp(28px, 6vw, 68px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        radial-gradient(circle at 85% 15%, rgba(255,128,94,.24), transparent 34%),
        linear-gradient(135deg, #292b23, #171813);
    }

    .eyebrow {
      color: var(--lime);
      font-weight: 700;
      letter-spacing: .18em;
      font-size: .85rem;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(2.8rem, 8vw, 6.2rem);
      line-height: .96;
    }

    .intro p {
      max-width: 650px;
      color: #d1d0c7;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    .genre-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 28px 0 42px;
    }

    .genre-nav a {
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
    }

    .genre-nav a:hover {
      background: var(--lime);
      color: #171810;
    }

    .genre-section {
      margin-top: 42px;
      scroll-margin-top: 24px;
    }

    .genre-heading {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 16px;
    }

    .genre-heading h2 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      overflow-wrap: anywhere;
    }

    .genre-count { color: var(--muted); }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .album-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      text-decoration: none;
      transition: transform .2s ease, border-color .2s ease;
    }

    .album-card:hover {
      transform: translateY(-4px);
      border-color: rgba(217,255,98,.7);
    }

    .album-cover {
      display: grid;
      aspect-ratio: 1;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #d9ff62, #ff805e);
      color: #171810;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 900;
    }

    .album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-info { padding: 14px; }

    .album-info h3 {
      margin: 0 0 6px;
      font-size: 1.05rem;
      overflow-wrap: anywhere;
    }

    .album-info p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .empty {
      padding: 24px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .album-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      main {
        width: calc(100% - 28px);
        padding-top: 24px;
      }

      .album-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 380px) {
      .album-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div id="nav-placeholder"></div>

  <main>
    <section class="intro">
      <div class="eyebrow">EXPLORE BY SOUND</div>
      <h1>按风格<br>找到声音。</h1>
      <p>从华语流行到嘻哈、R&B 和放克，按音乐风格浏览这份专辑收藏。</p>
    </section>

    <nav class="genre-nav" id="genre-nav" aria-label="跳转到音乐风格"></nav>
    <div id="genre-list"></div>
    <div class="empty" id="empty-state" hidden>
      没有读取到专辑。请确认 `js/albums-data.js` 中存在专辑数据，并且专辑包含 `genre` 字段。
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="nav.js"></script>
  <script src="js/albums-data.js"></script>

  <script>
    const albums = window.MUSIC_VAULT?.albums || [];
    const genreNav = document.getElementById("genre-nav");
    const genreList = document.getElementById("genre-list");
    const emptyState = document.getElementById("empty-state");

    if (albums.length === 0) {
      emptyState.hidden = false;
    } else {
      const groups = new Map();

      albums.forEach(album => {
        const genre = album.genre || "其他";
        if (!groups.has(genre)) groups.set(genre, []);
        groups.get(genre).push(album);
      });

      [...groups.entries()].forEach(([genre, genreAlbums], index) => {
        const sectionId = `genre-${index + 1}`;

        const navLink = document.createElement("a");
        navLink.href = `#${sectionId}`;
        navLink.textContent = genre;
        genreNav.appendChild(navLink);

        const section = document.createElement("section");
        section.className = "genre-section";
        section.id = sectionId;

        const heading = document.createElement("div");
        heading.className = "genre-heading";
        heading.innerHTML =
          `<h2></h2><span class="genre-count">${genreAlbums.length} 张专辑</span>`;
        heading.querySelector("h2").textContent = genre;

        const grid = document.createElement("div");
        grid.className = "album-grid";

        genreAlbums.forEach(album => {
          const link = document.createElement("a");
          link.className = "album-card";
          link.href = `album.html?id=${encodeURIComponent(album.id)}`;

          const cover = document.createElement("div");
          cover.className = "album-cover";

          if (album.cover) {
            const img = document.createElement("img");
            img.src = album.cover;
            img.alt = `${album.title} 专辑封面`;
            img.onerror = () => {
              cover.textContent = (album.title || "♪").slice(0, 1);
            };
            cover.appendChild(img);
          } else {
            cover.textContent = (album.title || "♪").slice(0, 1);
          }

          const info = document.createElement("div");
          info.className = "album-info";
          info.innerHTML = "<h3></h3><p></p>";
          info.querySelector("h3").textContent = album.title || "未命名专辑";
          info.querySelector("p").textContent =
            `${album.artist || "未知艺人"} · ${album.year || "年份未知"}`;

          link.append(cover, info);
          grid.appendChild(link);
        });

        section.append(heading, grid);
        genreList.appendChild(section);
      });
    }
  </script>
</body>
</html>
